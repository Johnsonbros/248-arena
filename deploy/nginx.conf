# 248 Arena — static site server config.
# Mounted into the nginx:alpine container by deploy/docker-compose.yml.
#
# Does three jobs the default config doesn't:
#   1. serves our branded 404 instead of nginx's grey error page
#   2. lets the browser cache fingerprint-free assets sanely (the service
#      worker handles real cache-busting, so HTML must never be cached hard)
#   3. sets baseline security headers

server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # A dead end with no way back is the worst part of a stale link.
    error_page 404 /404.html;
    location = /404.html { internal; }

    # HTML and the service worker must always revalidate, or a deploy takes
    # days to reach people who have the old copy cached.
    location ~* \.(?:html|json)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Static assets change with a version bump, so a week is safe and keeps
    # repeat visits fast on jobsite mobile data.
    location ~* \.(?:css|js|png|jpg|jpeg|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Baseline hardening. No CSP here on purpose: the app uses inline handlers
    # and Stripe's pricing table, so a CSP needs to be authored and tested
    # deliberately rather than bolted on and silently breaking checkout.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), payment=()" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
